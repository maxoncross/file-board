<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FileBoard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button id="toggleSide" class="tbtn" title="Панель файлов (Ctrl+B)">
      <svg viewBox="0 0 24 24" width="17" height="17"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 4v16" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <div id="tabs"></div>
    <button id="addBoard" class="tbtn" title="Новая доска">+</button>
    <div class="spacer"></div>
    <div id="searchWrap">
      <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" placeholder="Поиск на доске  Ctrl+F" spellcheck="false">
      <span id="searchCount"></span>
    </div>
  </header>

  <div id="main">
  <aside id="side">
    <div id="places"></div>
    <div id="sideNav">
      <button id="sBack" class="tbtn sm" title="Назад (Alt+←)">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="sFwd" class="tbtn sm" title="Вперёд (Alt+→)">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="sUp" class="tbtn sm" title="Вверх (Backspace)">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="crumbs" title="Клик — вписать путь"></div>
      <button id="sPin" class="tbtn sm" title="Положить эту папку на доску">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 7v10a2 2 0 0 0 2 2h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 14v7M14.5 17.5h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button id="sView"class="tbtn sm" title="Показать крупными значками"></button>
      <button id="sMore" class="tbtn sm" title="Ещё">
        <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
      </button>
    </div>
    <div id="sideFilterWrap">
      <svg viewBox="0 0 24 24" width="13" height="13"><path d="M4 5h16l-6 7v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <input id="sideFilter" placeholder="Фильтр в этой папке" spellcheck="false">
    </div>
    <div id="sideList"></div>
    <div id="sideFoot"></div>
  </aside>
  <div id="splitter" title="Потяните, чтобы изменить ширину"></div>
  <main id="board">
    <div id="world">
      <div id="frames"></div>
      <div id="items"></div>
    </div>
    <div id="marquee"></div>
    <div id="empty">
      <div class="empty-card">
        <div class="empty-title">Доска пуста</div>
        <div class="empty-row"><b>Перетащите</b> сюда файлы, папки или ярлыки из Проводника</div>
        <div class="empty-row"><b>Двойной клик</b> по пустому месту — заметка</div>
        <div class="empty-row"><b>Правый клик</b> — ссылка, рамка и другое</div>
        <div class="empty-row"><b>Ctrl+V</b> — вставить ссылку или текст</div>
      </div>
    </div>
    <div id="dropHint"><span>Отпустите, чтобы положить на доску</span></div>
  </main>
  </div>
  <div id="ghost"></div>

  <footer id="statusbar">
    <div id="status"></div>
    <div id="zoombar">
      <button id="zoomOut" class="tbtn" title="Отдалить">−</button>
      <button id="zoomVal" class="tbtn" title="Масштаб 100%">100%</button>
      <button id="zoomIn" class="tbtn" title="Приблизить">+</button>
      <button id="fit" class="tbtn" title="Показать всё (Ctrl+0)">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </footer>

  <div id="menu"></div>
  <div id="dialogBack"><div id="dialog"></div></div>
  <div id="toast"></div>

  <script src="app.js"></script>
  <script src="side.js"></script>
</body>
</html>
